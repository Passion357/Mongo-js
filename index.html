<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fair Bay City Project</title>
    <!-- <link rel="stylesheet" href="styles.css" /> -->
    
    <style >
        * {code
    text-align: center;
    box-sizing: border-box;
    color: rgb(3, 138, 138);
    font-family: 'Times New Roman';
}
.body>h1 {
    font-size: 2.5rem;
    font-weight: 800;
}
p {
    font-weight: 800;
}
body {
    background: radial-gradient(circle, black , rgba(17, 16, 16, 0.836));
    scroll-behavior: smooth;
}
.parent {
    display: flex;
    width: 100%;
}
.child {
    width: 50%;
    height: 30rem;
    overflow-y: scroll;
    padding-top: .5rem;
    padding-bottom: .5rem;
}
.child > input {
    width: 60%;
    text-align: left;
    padding: .4rem;
    color: #fff;
    background-color: black;
    opacity: 60%;
    transition: .4s;
    border: none;
    padding: 1rem;
    border-radius: 1rem;
}
.child > input:focus {
    padding: 1.4rem;
}
button {
    text-align: center;
    padding: .7rem;
    margin-top: 2rem;
    border-radius: .6rem;
    transition: .4s;
    width: 27%;
}
button:hover {
    scale: 115%;
    width: 30%;
    cursor: pointer;
    color: #fff;
    background: radial-gradient(circle, black , rgba(17, 16, 16, 0.836));
}

/* Define scrollbar styles */
::-webkit-scrollbar {
    width: 10px;
  }
  
  /* Track styles */
  ::-webkit-scrollbar-track {
    background-color: rgba(17, 16, 16, 0.836); 
    border-radius: 10px;
  }
  
  /* Handle (thumb) styles */
  ::-webkit-scrollbar-thumb {
    background-color: rgb(3, 138, 138); 
    border-radius: 10px; 
    border: 3px solid #f1f1f1; 
  }
  
  /* Handle on hover */
  ::-webkit-scrollbar-thumb:hover {
    background-color: #555; 
  }
  

@media screen and (max-width: 720px) {
    * {
        text-align: center;
        box-sizing: border-box;
    }
    .parent {
        display: block;
        width: 100%;
    }
    .child {
        width: 100%;
        height: max-content;
    overflow-y: hidden;
    }
    .button {
        text-align: center;
    }
    .child > input {
        width: 70%;
        text-align: left;
        padding: .4rem;
        color: #fff;
        background-color: black;
        opacity: 60%;
        transition: .4s;
        border: none;
        padding: 1rem;
        border-radius: 1rem;
    }   
}
    </style>
    
</head>
<body>
    <h1>Registration</h1>

    <form id="myForm">
        <div class="parent">
            <div class="child">
                <p >Email Address:</p>
                    <input placeholder="email address" type="email" id="email"/>

                    <p >First Name:</p>
                    <input placeholder="first name" type="text" id="first_name"/>

                    <p >Last Name: </p>
                    <input placeholder="last name" type="text" id="last_name"/>

                    <p>Date of birth:</p>
                    <input placeholder="date of birth" type="date" id="date_of_birth"/>

                    <p >street: </p>
                    <input placeholder="street" type="text" id="street"/>

                    <p>City:</p>
                    <input placeholder="city" type="text" id="city"/>

                    <p >State: </p>
                    <input placeholder="state" type="text" id="state"/>

                    <p>Post Code:</p>
                    <input placeholder="Post Code" type="number" id="post_code"/>

                    <p> Country: </p>
                    <input placeholder="Country" type="text" id="country"/>
            </div>

            <div class="child">
                <!-- ID Documents -->
                <h1 >ID Documents</h1>

                <p>drivers Licence: </p>
                <input placeholder="drivers licence" id="license_number"/>

                <p >Issue Date:</p>
                <input placeholder="issue date" type="number" id="issue_date"/>


                <!-- credit card details -->
                <h1 >Credit card Details</h1>

                <p >Name on Card: </p>
                <input placeholder="card name" id="name_on_card"/>

                <p >Card Number: </p>
                <input placeholder="card number " id="card_number"/>
                
                <p >Valid till: </p>
                <input type="date" id="valid_till"/>
            </div>
        </div>
        
        <button type="submit">Register</button>
    </form>

    <!-- <script src="script.js" /> -->
    <script >
        const form = document.getElementById("myForm");
        form.addEventListener('submit', (e) => {
    e.preventDefault();

    const formData = {
         email_address: document.getElementById('email').value,
         first_name: document.getElementById('first_name').value,
         last_name: document.getElementById('last_name').value, 
         date_of_birth : document.getElementById('date_of_birth').value, 
         address : {
            street : document.getElementById('street').value, 
            city : document.getElementById('city').value, 
            state : document.getElementById('state').value, 
            post_code : document.getElementById('post_code').value, 
            country : document.getElementById('country').value,
        },
        registration_date : new Date(),
        id_documents : [
            {
                drivers_license : {
                    license_number : document.getElementById('license_number').value,
                    issue_date : document.getElementById('issue_date').value 
            }
        }],
        payments : [
            {
                credit_card : {
                    name_on_card : document.getElementById('name_on_card').value,
                    card_number : document.getElementById('card_number').value,
                    valid_till : document.getElementById('valid_till').value 
                }
            }
        ] 
    }
    

    fetch('http://localhost:8000/submitData' , {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(formData)
    })
    .then(message => {
        console.log(message);
    })
    .catch(error => {
        console.error('Error:', error);
    })
});

    </script>
</body>
</html>
